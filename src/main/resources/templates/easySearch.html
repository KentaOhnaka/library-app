<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>簡単書籍検索</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <h1>簡単書籍検索</h1>

    <div class="search-form">
        <form th:action="@{/search/result}" method="get">
            <input type="text" name="keyword" size="50" th:value="${keyword}" placeholder="書籍名を入力してください">
            <button type="submit">検索</button>
        </form>
    </div>

    <div th:if="${books}">
        <div th:unless="${#lists.isEmpty(books)}">
            <h2>検索結果</h2>
            <table>
                <thead>
                    <tr>
                        <th>ISBN</th>
                        <th>書籍名</th>
                        <th>著者名</th>
                        <th>出版社</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="book : ${books}">
                        <td th:text="${book.isbn}">978-4-7981-5757-9</td>
                        <td th:text="${book.bookName}">Spring徹底入門</td>
                        <td th:text="${book.authorName}">株式会社NTTデータ</td>
                        <td th:text="${book.publishCompany}">翔泳社</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div th:if="${#lists.isEmpty(books) and keyword != ''}" class="no-results">
            <p th:text="|「${keyword}」に一致する書籍は見つかりませんでした。|"></p>
        </div>
    </div>

</body>
</html>
