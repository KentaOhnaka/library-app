<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${author.authorName}">著者詳細</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: pageHeader}"></div>

    <main class="detail-container" th:object="${author}">
        <div class="detail-header">
            <h1 th:text="*{authorName}">著者名</h1>
            <div class="detail-meta">
                <span><strong>所属:</strong> <span th:text="*{authorBelong}">著者所属</span></span>
                <span th:if="*{authorHomepage}">
                    <strong>HP:</strong> 
                    <a th:href="*{authorHomepage}" th:text="*{authorHomepage}" target="_blank"></a>
                </span>
            </div>
        </div>
        
        <div class="detail-books-list" th:if="*{!books.isEmpty()}">
            <h2>この著者の作品</h2>
            <table>
                <thead>
                    <tr>
                        <th>書籍名</th>
                        <th>出版社</th>
                        <th>出版日</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="book : *{books}">
                        <td>
                            <a th:href="@{/books/{isbn}(isbn=${book.isbn})}" th:text="${book.bookName}"></a>
                        </td>
                        <td th:text="${book.publishCompany}"></td>
                        <td th:text="${book.publishDate}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <a href="javascript:history.back()" class="btn btn-secondary">戻る</a>
    </main>

</body>
</html>
